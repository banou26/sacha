[package]
name = "sacha"
version = "0.2.0"
edition = "2021"
description = "A media string parser for filenames, torrent names, and any string representing media metadata"

[package.metadata.wasm-pack.profile.release]
# wasm-opt provides ~5-8% size savings on top of Rust LTO.
# Set to false if wasm-opt is not installed; otherwise wasm-pack uses it automatically.
# Install via: apt install binaryen  (or cargo install wasm-opt)
# Requires --enable-bulk-memory --enable-sign-ext flags for Rust 1.80+ output.
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-sign-ext"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nom = "7"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
