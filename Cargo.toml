[package]
name = "sacha"
version = "0.2.6"
edition = "2021"
description = "A media string parser for filenames, torrent names, and any string representing media metadata"

[package.metadata.wasm-pack.profile.release]
# optional: set `wasm-opt = false` when binaryen is not installed, otherwise wasm-pack picks it up automatically (apt install binaryen, or cargo install wasm-opt); buys roughly 5-8% size on top of Rust LTO
# The feature flags have to cover everything rustc emits, or wasm-opt refuses the module.
# nontrapping-float-to-int, reference-types and multivalue are what recent toolchains added on top of the bulk-memory and sign-ext that Rust 1.80 introduced; a toolchain bump usually means one more flag here
wasm-opt = [
    "-O2",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-multivalue",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `safe_read` drops frizbee's read past the end of a haystack, which assumes a 4096-byte page and does not hold in wasm linear memory.
frizbee = { version = "0.12", features = ["safe_read"] }
nom = "7"
js-sys = "0.3"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# snapshot test only, so it never reaches the wasm artifact
serde_json = "1"

[profile.release]
# speed over size: titleScores over a nyaa walk runs about 10 times faster than at "z" (HOR-513); the wasm grows from
# 1.08 to 1.48 MB, about 50 KB more on the wire as Cloudflare serves it (brotli)
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
